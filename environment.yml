# Conda environment for developing and running PmagPy and the PmagPy GUIs.
#
# Create with (from the repo root):
#   conda env create -f environment.yml -n pmagpy-dev
#   conda activate pmagpy-dev
#
# Then install PmagPy itself in editable mode:
#   pip install -e ".[maps]"
#
# Or install the released packages from PyPI:
#   pip install --upgrade "pmagpy[maps]" pmagpy-cli
#
# Without -n, the environment is named "pmagpy", matching the user install
# instructions at https://pmagpy.github.io/PmagPy-docs/installation/pip_install.html
name: pmagpy
channels:
  - conda-forge
dependencies:
  - python=3.12
  # core scientific stack — required by pmagpy
  - numpy
  - scipy
  - matplotlib
  - pandas
  - pytz
  # mapping (optional in the library, but conda-forge handles cartopy
  # and shapely cleanly across platforms)
  - cartopy
  - shapely
  # GUI / pmagpy-cli dependencies
  - wxpython
  - pillow
  - appdirs
  # interactive use
  - jupyterlab
  - ipython
  # running the test suite (pytest pmagpy/test)
  - pytest
  - pip
